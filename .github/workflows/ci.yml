name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install pytest flake8 pytest-cov mypy bandit pylint
      - name: Lint
        run: flake8
      - name: Type check (mypy)
        run: mypy fib tests
      - name: Security check (bandit)
        run: bandit -r fib
      - name: Static analysis (pylint)
        run: pylint fib
      - name: Run tests with coverage
        run: pytest --cov=fib --cov-report=term-missing

  publish:
    name: Publish Docker image
    needs:
      - test
    runs-on: ubuntu-latest
    # Only publish on direct pushes to main so pull requests run validation but skip image pushes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-gitea:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-gitea:${{ github.sha }}
