name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install pytest flake8 pytest-cov mypy bandit pylint
      - name: Lint
        run: flake8
      - name: Type check (mypy)
        run: mypy fib tests
      - name: Security check (bandit)
        run: bandit -r fib
      - name: Static analysis (pylint)
        run: pylint fib
      - name: Run tests with coverage
        run: pytest --cov=fib --cov-report=term-missing

  ai_security_review:
    name: Snyk Code AI review
    needs: test
    if: ${{ secrets.SNYK_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Install Snyk CLI
        run: npm install -g snyk
      - name: Run Snyk Code scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          mkdir -p reports
          snyk code test --severity-threshold=medium --json-file-output=reports/snyk-code.json
      - name: Upload Snyk Code report
        uses: actions/upload-artifact@v4
        with:
          name: snyk-code-report
          path: reports/snyk-code.json

  publish:
    name: Publish Docker image
    needs:
      - test
      - ai_security_review
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-gitea:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-gitea:${{ github.sha }}
