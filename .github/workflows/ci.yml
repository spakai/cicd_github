name: CI (self-healing)

on:
  push:
    branches: [ "**" ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write
  issues: write
  pull-requests: write
  security-events: write        # for CodeQL
  models: read                  # for GitHub Models (LLM summary)

env:
  PYTHON_VERSION: "3.11"
  POETRY_VIRTUALENVS_CREATE: "false"
  # Feature flags (toggle without editing steps)
  USE_PYTEST_TESTMON: "true"       # set to "true" when you add pytest-testmon (incompatible with -m markers)
  USE_RERUNS: "true"
  USE_MODELS_SUMMARY: "true"    # set to "true" if you have GitHub Models enabled
  PUBLISH_ON_MAIN: "true"       # uses Docker Hub creds (secrets below)
  IMAGE_NAME: "${{ secrets.DOCKERHUB_USERNAME }}/cicd-gitea"

jobs:
  test:
    permissions:
      contents: write
      models: read
    name: Lint • Typecheck • Test (self-heal)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Install deps (with test tooling)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 mypy bandit pylint
          if [ "${{ env.USE_RERUNS }}" = "true" ]; then pip install pytest-rerunfailures; fi
          if [ "${{ env.USE_PYTEST_TESTMON }}" = "true" ]; then pip install pytest-testmon; fi

      - name: Static checks
        run: |
          flake8
          mypy fib tests
          bandit -q -r fib
          pylint -E fib || true  # warnings only; do not fail build on style nits

      # --- Tests (self-healing flags) ---
      - name: Run tests
        id: run_pytest
        run: |
          set -e
          PYTEST_BASE="pytest -q --junitxml=report.xml --cov=fib --cov-report=term-missing"
          if [ "${{ env.USE_RERUNS }}" = "true" ]; then 
            echo "🧪 Self-healing: Auto-retry enabled (2 retries with 0.1s delay)"
            PYTEST_BASE="$PYTEST_BASE --reruns 2 --reruns-delay 0.1"
          fi
          if [ "${{ env.USE_PYTEST_TESTMON }}" = "true" ]; then
            echo "🤖 pytest-testmon: Running only tests affected by changed files"
            PYTEST_BASE="$PYTEST_BASE --testmon"
          fi
          echo "📋 Running test suite"
          $PYTEST_BASE

      - name: Upload LLM debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-debug
          path: |
            llm_raw.json
            llm_summary.txt
            commit_comment_resp.json
          if-no-files-found: ignore

      - name: Always upload JUnit + coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            report.xml
            .pytest_cache/**
          if-no-files-found: ignore

      - name: Self-healing Summary
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🧠 INTELLIGENT CI/CD FEATURES USED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Self-healing enabled: ${{ env.USE_RERUNS }}"
          echo "✅ pytest-testmon: ${{ env.USE_PYTEST_TESTMON }}"
          echo "✅ AI failure analysis: ${{ env.USE_MODELS_SUMMARY }}"
          echo "✅ Docker retry: Enabled (3 attempts)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # --- Healer: classify failure & attempt automatic remedy ---
      - name: Classify failure (simple)
        if: failure()
        run: |
          set -e
          echo "🔍 Self-healing: Analyzing failure..."
          REMEDY=human_review
          if grep -qiE "timeout|Connection (reset|timed)|Network is unreachable" report.xml; then
            REMEDY=retry_last_failed
            echo "   ⚡ Detected: Network/Timeout issue"
            echo "   🔧 Action: Will retry last failed tests"
          elif grep -qiE "AssertionError|FAILED .*::" report.xml; then
            REMEDY=rerun_flaky
            echo "   ⚡ Detected: Potential flaky test"
            echo "   🔧 Action: Will rerun with delays"
          else
            echo "   ⚡ Detected: Unknown failure"
            echo "   🔧 Action: Requires human review"
          fi
          echo "REMEDY=$REMEDY" | tee -a $GITHUB_ENV

      - name: Auto-remedy • retry last failed
        if: failure() && env.REMEDY == 'retry_last_failed'
        uses: Wandalen/wretry.action@v3.8.0
        with:
          attempt_limit: 2
          command: |
            echo "🔄 Self-healing: Retrying failed tests (attempt 1/2)..."
            pytest -q --last-failed --junitxml=report2.xml

      - name: Auto-remedy • rerun suspected flakies
        if: failure() && env.REMEDY == 'rerun_flaky'
        run: |
          echo "🔄 Self-healing: Rerunning suspected flaky tests..."
          pytest -q --reruns 2 --reruns-delay 3 --junitxml=report2.xml

      # --- LLM failure triage (kept inside GitHub) ---
      - name: Summarize with GitHub Models (LLM)
        if: failure() && env.USE_MODELS_SUMMARY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🤖 AI Analysis: Analyzing failure with GitHub Models..."
          tail -n 500 report.xml > last_logs.txt || true
          # Stronger prompt: request a concise bullet-list (4 items max) and require a short answer
          BODY=$(jq -n --arg t "Summarize CI failure logs and propose fixes: flakes vs network vs real regression. Provide up to 4 short bullet points (each starting with '-'). If there's nothing to report, reply 'no summary'. Keep it <200 chars." \
                       --arg l "$(cat last_logs.txt 2>/dev/null || echo 'no junit')" \
                       '{messages:[{role:"user",content:($t+"\n\nLOGS:\n"+$l)}]}')
          # Call GitHub Models Inference API
          RESP=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
                      -H "Content-Type: application/json" \
                      -X POST https://api.github.com/models/inference \
                      -d "$BODY" || echo "{}")

          # Debug prints (does not include GH_TOKEN). Trim RESP for log size.
          echo "--- DEBUG: BODY ---"
          echo "$BODY" | sed -n '1,200p'
          echo "--- DEBUG: last_logs.txt (first 200 lines) ---"
          sed -n '1,200p' last_logs.txt || echo '(no last_logs.txt)'
          echo "--- DEBUG: RESP (first 200 lines) ---"
          echo "$RESP" | sed -n '1,200p'

          # If the Models API returns a 404/Not Found, provide a clear summary message
          API_MESSAGE=$(echo "$RESP" | jq -r '.message // empty' 2>/dev/null || echo "")
          if [ "${API_MESSAGE}" = "Not Found" ]; then
            echo "⚠️ Models API returned 'Not Found' — Models may not be enabled for this repo/org or token lacks access."
            SUMMARY="(GitHub Models unavailable: enable Models for this repository or organization, or set USE_MODELS_SUMMARY=false)"
            echo "$RESP" > llm_raw.json
            echo "$SUMMARY" > llm_summary.txt
            echo "Extracted LLM summary (logging for debug):"
            echo "$SUMMARY"
            # Skip further model extraction and proceed to posting the explanatory summary
            :
          fi
          # Save raw response for debugging
          echo "$RESP" > llm_raw.json

          # Attempt multiple extraction paths for different model response shapes
          TRY1=$(echo "$RESP" | jq -r '.choices[0].message.content // empty' 2>/dev/null || echo "")
          TRY2=$(echo "$RESP" | jq -r '.choices[0].text // empty' 2>/dev/null || echo "")
          TRY3=$(echo "$RESP" | jq -r '.data[0].text // empty' 2>/dev/null || echo "")
          TRY4=$(echo "$RESP" | jq -r '..|.content? // empty' 2>/dev/null | tr '\n' '\x1f' | sed 's/\x1f/\n/g' | head -n 50 || echo "")
          SUMMARY=$(printf "%s\n%s\n%s\n%s\n" "$TRY1" "$TRY2" "$TRY3" "$TRY4" | sed '/^$/d' | head -n 50)
          # Fallback if summary is empty
          if [ -z "$(echo "$SUMMARY" | tr -d '\n' | tr -d '[:space:]')" ]; then
            SUMMARY="(no summary produced by models)"
          fi
          echo "$SUMMARY" > llm_summary.txt
          echo "✅ AI Analysis complete"
          echo "Extracted LLM summary (logging for debug):"
          echo "$SUMMARY"
          # Post to PR/commit
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "📝 Posting AI summary to PR..."
            gh pr comment ${{ github.event.number }} --body "🤖 **CI Triage (LLM):**\n\n$SUMMARY"
          else
            echo "📝 Posting AI summary to commit..."
            # Use curl with GH_TOKEN to create a commit comment directly (preserves newlines and content)
            PAYLOAD=$(jq -n --arg b "🤖 **CI Triage (LLM):**\n\n$SUMMARY" '{body:$b}')
            RESP2=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                         -H "Content-Type: application/json" \
                         -X POST "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
                         -d "$PAYLOAD" || echo "{}")
            echo "$RESP2" > commit_comment_resp.json
            # Print the comment URL for visibility in Actions logs
            echo "Commit comment response:"
            echo "$RESP2" | jq -r '.html_url // .url // "(no url returned)"'
          fi

  publish:
    name: Docker build & push (with retry)
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push (retry)
        uses: Wandalen/wretry.action@v3.8.0
        with:
          attempt_limit: 3
          command: |
            echo "🔄 Self-healing: Building Docker image (with auto-retry on failure)..."
            docker build -t ${{ env.IMAGE_NAME }}:latest -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
            echo "📤 Pushing images to Docker Hub..."
            docker push ${{ env.IMAGE_NAME }}:latest
            docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
            echo "✅ Docker images published successfully"

  codeql:
    name: CodeQL (optional; enables Copilot Autofix if turned on)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Analyze
        uses: github/codeql-action/analyze@v3
    # Enable Copilot Autofix in repo/org Security settings to get AI remediation suggestions on alerts.
