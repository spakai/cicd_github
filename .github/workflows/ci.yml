name: CI (self-healing)

on:
  push:
    branches: [ "**" ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write
  issues: write
  pull-requests: write
  security-events: write        # for CodeQL
  models: read                  # for GitHub Models (LLM summary)

env:
  PYTHON_VERSION: "3.11"
  POETRY_VIRTUALENVS_CREATE: "false"
  # Feature flags (toggle without editing steps)
  USE_LAUNCHABLE: "false"       # set to "true" when you add Launchable token
  USE_RERUNS: "true"
  USE_MODELS_SUMMARY: "true"    # requires GitHub Models to be enabled for the repo/org
  PUBLISH_ON_MAIN: "true"       # uses Docker Hub creds (secrets below)
  IMAGE_NAME: "${{ secrets.DOCKERHUB_USERNAME }}/cicd-gitea"

jobs:
  test:
    name: Lint • Typecheck • Test (self-heal)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Install deps (with test tooling)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 mypy bandit pylint
          if [ "${{ env.USE_RERUNS }}" = "true" ]; then pip install pytest-rerunfailures; fi
          if [ "${{ env.USE_LAUNCHABLE }}" = "true" ]; then pip install launchable; fi

      - name: Static checks
        run: |
          flake8
          mypy fib tests
          bandit -q -r fib
          pylint -E fib || true  # warnings only; do not fail build on style nits

      # --- Predictive test selection (ML) — optional ---
      - name: Launchable • record build
        if: env.USE_LAUNCHABLE == 'true'
        env:
          LAUNCHABLE_TOKEN: ${{ secrets.LAUNCHABLE_TOKEN }}
        run: |
          launchable record build --name "$GITHUB_SHA"

      - name: Launchable • make subset (PRs only)
        if: env.USE_LAUNCHABLE == 'true' && github.event_name == 'pull_request'
        run: |
          # enumerate pytest tests (node ids)
          python - <<'PY'
          import pathlib, subprocess, sys
          r = subprocess.run([sys.executable, "-m", "pytest", "--collect-only", "-q"], capture_output=True, text=True)
          pathlib.Path("all-tests.txt").write_text("\n".join([l for l in r.stdout.splitlines() if "::" in l]))
          PY
          launchable subset --build "$GITHUB_SHA" pytest < all-tests.txt > subset.txt || true

      # --- Tests (self-healing flags) ---
      - name: Run tests
        id: run_pytest
        run: |
          set -e
          PYTEST_BASE="pytest -q --junitxml=report.xml --cov=fib --cov-report=term-missing"
          if [ "${{ env.USE_RERUNS }}" = "true" ]; then PYTEST_BASE="$PYTEST_BASE --reruns 2 --reruns-delay 3"; fi
          if [ -s subset.txt ]; then
            echo "Running Launchable subset…"
            $PYTEST_BASE $(cat subset.txt)
          else
            $PYTEST_BASE
          fi

      - name: Always upload JUnit + coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            report.xml
            .pytest_cache/**
          if-no-files-found: ignore

      # --- Healer: classify failure & attempt automatic remedy ---
      - name: Classify failure (simple)
        if: failure()
        run: |
          set -e
          REMEDY=human_review
          if grep -qiE "timeout|Connection (reset|timed)|Network is unreachable" report.xml; then
            REMEDY=retry_last_failed
          elif grep -qiE "AssertionError|FAILED .*::" report.xml; then
            REMEDY=rerun_flaky
          fi
          echo "REMEDY=$REMEDY" | tee -a $GITHUB_ENV

      - name: Auto-remedy • retry last failed
        if: failure() && env.REMEDY == 'retry_last_failed'
        uses: Wandalen/wretry.action@v3.8.0
        with:
          attempt_limit: 2
          command: |
            pytest -q --last-failed --junitxml=report2.xml

      - name: Auto-remedy • rerun suspected flakies
        if: failure() && env.REMEDY == 'rerun_flaky'
        run: pytest -q --reruns 2 --reruns-delay 3 --junitxml=report2.xml

      # --- LLM failure triage (kept inside GitHub) ---
      - name: Summarize with GitHub Models (LLM)
        if: failure() && env.USE_MODELS_SUMMARY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -n 500 report.xml > last_logs.txt || true
          BODY=$(jq -n --arg t "Summarize CI failure logs and propose fixes: flakes vs network vs real regression. Bullet points, short." \
                       --arg l "$(cat last_logs.txt 2>/dev/null || echo 'no junit')" \
                       '{messages:[{role:"user",content:($t+"\n\nLOGS:\n"+$l)}]}')
          # Call GitHub Models Inference API
          RESP=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
                      -H "Content-Type: application/json" \
                      -X POST https://api.github.com/models/inference \
                      -d "$BODY" || echo "{}")
          SUMMARY=$(echo "$RESP" | jq -r '..|.content? // empty' | head -n 50)
          echo "$SUMMARY" > llm_summary.txt
          # Post to PR/commit
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh pr comment ${{ github.event.number }} --body "🤖 **CI Triage (LLM):**\n\n$SUMMARY"
          else
            gh issue comment ${{ github.sha }} --body "🤖 **CI Triage (LLM):**\n\n$SUMMARY" || true
          fi

  publish:
    name: Docker build & push (with retry)
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push (retry)
        uses: Wandalen/wretry.action@v3.8.0
        with:
          attempt_limit: 3
          command: |
            docker build -t ${{ env.IMAGE_NAME }}:latest -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
            docker push ${{ env.IMAGE_NAME }}:latest
            docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

  codeql:
    name: CodeQL (optional; enables Copilot Autofix if turned on)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Analyze
        uses: github/codeql-action/analyze@v3
    # Enable Copilot Autofix in repo/org Security settings to get AI remediation suggestions on alerts.
