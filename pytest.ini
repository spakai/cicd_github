[pytest]
# Pytest configuration for intelligent test selection and self-healing

# Markers for test categorization
markers =
    flaky: Marks tests as flaky (may fail randomly)
    timeout: Marks tests that may timeout
    ml_critical: Critical path tests that ML should always select
    ml_affected: Tests affected by recent changes
    ml_high_risk: Tests in high-risk areas
    ml_low_priority: Tests that can be safely skipped by ML
    ml_experimental: Tests for experimental features

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage options
testpaths = tests

# Timeout configuration (in seconds)
timeout = 30
timeout_method = thread

# Retry configuration (for flaky tests)
# This is handled by pytest-rerunfailures in the CI pipeline
reruns = 2
reruns_delay = 3

# JUnit XML output for CI
junit_family = xunit2

